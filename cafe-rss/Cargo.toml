[package]
name = "cafe-rss"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cafe-rss"
path = "src/main.rs"

[dependencies]
cafe-types           = { path = "../cafe-types" }
cafe-sdk             = { path = "../cafe-sdk", features = ["bus-client"] }
