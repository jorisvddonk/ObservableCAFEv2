version: "0.5"

processes:
  cafe-bus:
    command: ./target/release/cafe-bus
    environment:
      - "RUST_BACKTRACE=1"
      - "CAFE_BUS_IROH_NAMESERVER=1.1.1.1:53"
    readiness_probe:
      exec:
        command: "test -S /tmp/cafe-bus.sock"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10

  cafe-store:
    command: ./target/release/cafe-store
    environment:
      - "RUST_BACKTRACE=1"
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-bus:
        condition: process_healthy

  cafe-binary-store:
    command: ./target/release/cafe-binary-store --port 4002 --bus-socket /tmp/cafe-bus.sock --public-host 100.89.166.119
    environment:
      - "RUST_BACKTRACE=1"
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 2
      failure_threshold: 10
    depends_on:
      cafe-bus:
        condition: process_healthy

  cafe-llm:
    command: ./target/release/cafe-llm
    environment:
      - "RUST_BACKTRACE=1"
      - "LLM_BACKEND=openai"
      - "OPENAI_URL=http://localhost:6900"
      - "OPENAI_MODEL=gemma3:1b"
      - "MODEL_LIST_URLS=http://localhost:6900"
      - "OLLAMA_URL=http://localhost:6900"
      - "OLLAMA_MODEL=gemma3:1b"
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-bus:
        condition: process_healthy

  cafe-agent-runtime:
    command: ./target/release/cafe-agent-runtime
    environment:
      - "RUST_BACKTRACE=1"
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-bus:
        condition: process_healthy
      cafe-store:
        condition: process_healthy

  cafe-agent-js:
    command: ./target/release/cafe-agent-js
    environment:
      - "RUST_BACKTRACE=1"
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-bus:
        condition: process_healthy
      cafe-store:
        condition: process_healthy

  cafe-server:
    command: ./target/release/cafe-server
    environment:
      - "PORT=4000"
      - "RUST_BACKTRACE=1"
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-bus:
        condition: process_healthy
      cafe-store:
        condition: process_healthy

  cafe-telegram:
    command: ./cafe-telegram/cafe-telegram
    environment:
      - "TELEGRAM_TOKEN="
      - "CAFE_SERVER_URL=http://localhost:4000"
    disabled: true
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-server:
        condition: process_healthy

  cafe-web-static:
    command: npx http-server dist -p 8088 --cors
    working_dir: ./cafe-web
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-server:
        condition: process_healthy

  cafe-tts:
    command: ./target/release/cafe-tts
    environment:
      - "RUST_BACKTRACE=1"
      - "TTS_BACKEND=speech-server"
      - "SPEECH_SERVER_URL=http://127.0.0.1:6900"
      - "VOICEBOX_URL=http://127.0.0.1:17493"
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-bus:
        condition: process_healthy
    # Optional — only meaningful when Voicebox or speech-server is running.
    # Set TTS_BACKEND=voicebox to use legacy Voicebox API.
    disabled: false

  cafe-epub:
    command: ./target/release/cafe-epub
    environment:
      - "RUST_BACKTRACE=1"
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-bus:
        condition: process_healthy
      cafe-store:
        condition: process_healthy

  cafe-comfy:
    command: ./target/release/cafe-comfy
    environment:
      - "RUST_BACKTRACE=1"
      - "COMFY_URL=http://127.0.0.1:8188"
      - "COMFY_WORKFLOW_PATH=./cafe-comfy/workflow.json"
      - "COMFY_WORKFLOW_INPUT_NODE=6"
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-bus:
        condition: process_healthy
    # Optional — only meaningful when a ComfyUI server is running.
    # Set disabled: true if you don't have ComfyUI available.
    disabled: false

  cafe-hue:
    command: ./target/release/cafe-hue
    environment:
      - "RUST_BACKTRACE=1"
      - "HUE_BRIDGE_URL="
      - "HUE_API_KEY="
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-bus:
        condition: process_healthy
    # Optional — only meaningful when a Hue bridge is reachable.
    # Set HUE_BRIDGE_URL and HUE_API_KEY to enable, or leave empty.
    disabled: false

  cafe-sheetbot:
    command: ./target/release/cafe-sheetbot
    environment:
      - "RUST_BACKTRACE=1"
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-bus:
        condition: process_healthy
    # Optional — only meaningful when a SheetBot server is running.
    # Set disabled: true if you don't have SheetBot available.
    disabled: false

  cafe-stt:
    command: ./target/release/cafe-stt
    environment:
      - "RUST_BACKTRACE=1"
      - "STT_BACKEND=speech-server"
      - "SPEECH_SERVER_URL=http://127.0.0.1:6900"
      - "VOICEBOX_URL=http://127.0.0.1:17493"
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-bus:
        condition: process_healthy
    disabled: false

  cafe-web-fetch:
    command: ./target/release/cafe-web-fetch
    environment:
      - "RUST_BACKTRACE=1"
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-bus:
        condition: process_healthy

  cafe-rss:
    command: ./target/release/cafe-rss
    environment:
      - "RUST_BACKTRACE=1"
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-bus:
        condition: process_healthy

  cafe-knowledgebase:
    command: ./target/release/cafe-knowledgebase
    environment:
      - "RUST_BACKTRACE=1"
      - "CAFE_KNOWLEDGEBASE_EMBED_URL=http://localhost:6900/v1/embeddings"
      - "CAFE_KNOWLEDGEBASE_EMBED_MODEL=user.gemma3-embed"
      - "CAFE_KNOWLEDGEBASE_EMBED_DIM=1152"
      - "CAFE_KNOWLEDGEBASE_DB_PATH=./knowledgebase.lance"
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-bus:
        condition: process_healthy

  cafe-mcp-bridge:
    command: ./target/release/cafe-mcp-bridge --transport http --port 3100 --meta
    environment:
      - "RUST_BACKTRACE=1"
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-bus:
        condition: process_healthy

  cafe-mcp-client:
    command: ./target/release/cafe-mcp-client
    environment:
      - "RUST_BACKTRACE=1"
      - "CAFE_MCP_SERVERS=mcp-servers.toml"
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-bus:
        condition: process_healthy

  cafe-rot13:
    command: ./target/release/cafe-rot13
    environment:
      - "RUST_BACKTRACE=1"
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-bus:
        condition: process_healthy

  cafe-demo:
    command: ./target/release/cafe-demo
    environment:
      - "RUST_BACKTRACE=1"
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-bus:
        condition: process_healthy
    # One-shot demo: publishes demo chunks (text, audio, image, error) to a "demo" session.
    # Set disabled: false to run on startup.
    disabled: true

  cafe-beacon:
    command: ./target/release/cafe-beacon
    environment:
      - "RUST_BACKTRACE=1"
    readiness_probe:
      exec:
        command: "true"
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 10
    depends_on:
      cafe-bus:
        condition: process_healthy
