[book]
title = "CAFE"
description = "A Unix-philosophy reimplementation of the CAFE architecture as a suite of small, composable programs."
src = "docs"
language = "en"

[build]
build-dir = "site"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/jorisvddonk/CAFE"
edit-url-template = "https://github.com/jorisvddonk/CAFE/edit/main/{path}"
site-url = "/CAFE/"
additional-js = ["mermaid.min.js", "mermaid-init.js"]
additional-css = ["theme/custom.css"]

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
